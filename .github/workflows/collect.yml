# Deze workflow is de "wekker" van de maintainer-druk-meter.
# GitHub start hem elke 15 minuten op een eigen computer (een "runner"),
# draait collect.py en zet de nieuwe data terug in de repo.

name: Verzamel reacties

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 minuten (tijd in UTC; GitHub kan wat vertraging hebben)
  workflow_dispatch:          # knop "Run workflow" om hem handmatig te starten

permissions:
  contents: write             # nodig om de data terug te committen

concurrency:
  group: collector            # nooit twee runs tegelijk
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      - name: Python klaarzetten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakketten installeren
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Hugging Face-model uit de cache halen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-twitter-roberta-sentiment-latest

      - name: Reacties ophalen en sentiment bepalen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
        run: python collect.py

      - name: Nieuwe data opslaan in de repo
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Niets nieuws."
            exit 0
          fi
          git commit -m "data: run $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
